# DegradX — frozen pre-declarations (brief R7)
#
# Every constant the paper declares by design lives here, and nothing it says is estimated from
# data. The split reproduces paper §3.3 (paper/paper.tex l.238) exactly; items the paper needs
# but does not list are added under `declared_by_design` with source UNDERSPECIFIED-IN-PAPER.
#
# Per entry:  value | source (paper line or UNDERSPECIFIED-IN-PAPER) | rationale |
#             affects_fitted_parameters (true => blocks progress past S3 until confirmed)
# Research reports behind the rationales: docs/S0_RESEARCH/*.md

meta:
  revision: r3
  paper_commit: 6221c50
  status: >-
    r1 was frozen at S0 before any data-consuming code ran (tag declarations-frozen). r2 resolves
    the four OPEN items by review comments C1-C4 and is frozen before S1 (tag declarations-frozen-r2).
    No data had been ingested or fitted when r2 was written.
    r3 (2026-10-07, brief "DegradX v2", branch v2, after tag v1-results) adds declared_by_design.v2 for changes X1-X8 before
    any v2 stage ran; it was written after the v1 results (S0-S9) were known, which every r3 rationale states. The
    declarations as they stood at tag v1-results (r2 as amended through D20) are kept verbatim in
    configs/declarations_history/declarations_at_v1-results.yaml; the frozen r2 itself is at tag declarations-frozen-r2.
  # Supersession record (brief v2 §1: a frozen declaration is superseded with a dated record, never
  # rewritten silently). r1 is kept verbatim in configs/declarations_history/declarations_r1.yaml.
  supersession_log:
    - {date: 2026-09-15, comment: C1, keys: [declared_by_design.target.weights_a_b, declared_by_design.target.decomposable_target, declared_by_design.target.reference_point, declared_by_design.channels.roles, declared_by_design.inserted_patterns_generation.carrying_channels],
       r1: "weights a (graded) and b (patterns) OPEN; channel roles OPEN (draft only)",
       r2: "one weight per cell w_{u,c} = kappa_c * pi_u about a declared reference point x0_c = phi_c(0); roles fixed",
       reason: "a linear map of the observed window cannot reproduce Eq. 4 as written in r1 (pattern channels also carry the mean component)"}
    - {date: 2026-09-15, comment: C2, keys: [declared_by_design.channels.null, declared_by_design.usability.permutation_importance_tolerance, declared_by_design.usability.redundant_channels, declared_by_design.usability.identifiability_floor, declared_by_design.attribution.primary_scoring_target],
       r1: "permutation importance ~0 gated on all zero-weight channels (tolerance OPEN); no null channels; no identifiability diagnostic",
       r2: "two declared null channels per profile carry the gated leakage test; redundant zero-weight channels reported (predictability, conditional importance), not gated; reference model primary; ensemble identifiability floor",
       reason: "every channel is phi_c(z), so a zero-weight channel still carries the state: the r1 test cannot separate leakage from benign redundancy, and phi* is not identifiable for a trained model"}
    - {date: 2026-09-15, comment: C3, keys: [declared_by_design.eol.anchor, declared_by_design.eol.q1_reference, declared_by_design.eol.denominator_guard, declared_by_design.eol.rho_sensitivity_grid, declared_by_design.eol.definitions_reported],
       r1: "z_t = (q1 - q_t) / ((1 - rho) q1), q1 = first position of smoothed capacity (status OPEN)",
       r2: "z_t = (q1 - q_t) / (q1 - rho * q_nom), q_nom per profile from primary documentation, q1 = max smoothed capacity over first k=20 positions, guard q1 - rho*q_nom >= 0.05 q_nom; r1 definition kept as a sensitivity point",
       reason: "MATR/HUST cells were cycled to 80% of nominal capacity; rho applied to a higher observed initial capacity puts EOL below where cycling stopped, and early capacity rise makes a first-position anchor give z < 0"}
    - {date: 2026-09-15, comment: C4, keys: [declared_by_design.attribution.baseline],
       r1: "attribution baseline OPEN (TimeSHAP convention: average-event background)",
       r2: "primary baseline = pristine window x0 for IG, occlusion and TimeSHAP background; ground truth supplied per baseline; secondary TimeSHAP run from the average event scored against phi*(xbar)",
       reason: "Shapley and path methods satisfy sum(phi) = f(x) - f(baseline); scoring against phi* presumes f(baseline) = 0, which an average event does not satisfy under a drifting mean"}
    - {date: 2026-09-15, comment: D13, keys: [declared_by_design.eol.record_end_rule],
       r2: "T = min{t : z_t >= 1} only",
       new: "measured records ending within 0.01 q_nom of the threshold reach EOL at their last position",
       reason: "HUST and MATR b1/b3 records were truncated at the stopping threshold (S1); strict attainment was 11/77 HUST, 96/180 MATR"}
    - {date: 2026-09-15, comment: D11, keys: [declared_by_design.capacity_series.source], r2: "capacity = max discharge capacity of the cycle (source unnamed)", new: "cycler-reported per-cycle capacity", reason: "HUST integrated capacity reads +18 mAh; 1/77 vs 77/77 units reach EOL"}
    - {date: 2026-09-15, comment: D12, keys: [declared_by_design.capacity_series.cleaning_rule], r2: "no glitch rule", new: "isolated > 5% q_nom excursions and recovered collapses below 50% q_nom removed", reason: "single-cycle glitches set q1, T = 1-3 on NASA units, broke monotonicity in 16 MATR units"}
    - {date: 2026-09-15, comment: D14, keys: [declared_by_design.datasets.matr_batches], r2: "all four MATR batches (status CONFIRM)", new: "the three Severson 2019 batches", reason: "the cited dataset; batch 4 IR is zero in every cycle"}
    - {date: 2026-09-15, comment: D16, keys: [declared_by_design.pattern_detection.residual, declared_by_design.pattern_detection.max_duration], r2: "families fitted over 1..T; runs of any length >= m", new: "families fitted over t1..T; runs longer than the smoothing window are not patterns", reason: "early-rise misfit and low-frequency misfit dominated MATR/HUST detections"}
    - {date: 2026-09-15, comment: D04, keys: [declared_by_design.trajectory_families.selection.simplicity_margin, declared_by_design.statistics.splits.measured.stratify_by], r2: "selection by lowest median CV-RMSE, no margin; split unstratified", new: "5% relative simplicity margin; split stratified by EOL attainment", reason: "declared before S3 so the family choice and split cannot follow the observed errors"}
    - {date: 2026-09-15, comment: D05, keys: [declared_by_design.pattern_detection.enable_rule], r2: "enabled iff >= 1 run detected", new: "enabled iff detected rate >= 2x the rate on the profile's fitted AR(1) noise", reason: "at k = 2.5 MATR/HUST detections are below their noise-only rate (ratio 0.79/0.46); NASA 7.97"}
    - {date: 2026-09-15, comment: D17, keys: [declared_by_design.channel_series.cleaning_rule], r2: "no channel glitch rule", new: "isolated > 5% of channel median departures masked", reason: "a few readings inflated MATR charge-time noise variance 25x"}
    - {date: 2026-09-15, comment: D02, keys: [declared_by_design.minimum_counts], r2: "censored units excluded from everything; no minimum counts", new: "censored units feed T-free quantities; minima 5 units / 10 events / 5 held-out units", reason: "z is defined for censored units (C3); readability curves from resampling"}
    - {date: 2026-09-15, comment: D04b, keys: [declared_by_design.trajectory_families.selection.identifiability], r2: "all families eligible", new: "families with parameters at bounds in > 20% of units not eligible", reason: "NASA rollover: transition width at its lower bound in 6 of 8 units; T reproduction p90 26% vs 9.6% for power law"}
    - {date: 2026-09-15, comment: D01, keys: [declared_by_design.scoring], r2: "scores unspecified (rank agreement, retrieval, zero-weight mass named only)", new: "Spearman on pattern-free map vs graded field; AP on paired difference vs sparse set; plain AP secondary", reason: "plain retrieval scores the ground truth itself at chance (0.064 vs 0.048); paired 1.000"}
    - {date: 2026-09-15, comment: D02b, keys: [declared_by_design.minimum_counts.held_out_units_per_measure], r2: "5 held-out units for every measure (provisional)", new: "transfer 20 reaching; covariance 12; discriminator 8 (distance-to-0.5 readability); representation distance by unit bootstrap", reason: "resampling over MATR held-out units; a 5-unit split leaves the discriminator one test unit"}
    - {date: 2026-09-15, comment: D15, keys: [declared_by_design.eol.eol_search_start], r2: "T = min{t : z_t >= 1}", new: "T = min{t >= t1 : z_t >= 1}", reason: "the fall is measured from q1; one NASA unit had T = 1 from readings before q1"}
    - {date: 2026-09-16, comment: D20, keys: [declared_by_design.responsiveness.operating_range.probes], r2: "probe unspecified (the paper does not say on which model the operating-range score is computed)", new: "both the reference model and IG on the trained model, with the accuracy gate applied to the trained probe", reason: "on the trained probe alone all 57 examined setting values are responsive, including two whose trained scores are void under the gate"}
    - {date: 2026-10-07, comment: "r3 / D25 (X8)", keys: [declared_by_design.target.position_profiles.final_position, declared_by_design.responsiveness.generator_settings, declared_by_design.fidelity.representation_distance, declared_by_design.datasets.nasa_pcoe_cells],
       r2: "three weightings; generator-setting sweep; representation distance; NASA PCoE profile; cross-fitting harness (D19)",
       r3: "v2 stages: recency primary, uniform sensitivity; no setting sweep, no representation distance, no NASA PCoE, no cross-fitting (declared_by_design.v2.scope)",
       reason: "v1 showed each answered nothing: final position tie-dominated (0.14-0.18 vs ceiling 0.84-0.87); sweep responsive almost everywhere; representation distance void for MATR; NASA PCoE void on every fidelity measure (D19, D21)"}
    - {date: 2026-10-07, comment: "r3 (X2)", keys: [declared_by_design.channel_mappings.capacity, declared_by_design.channel_mappings.value, declared_by_design.theta_distribution],
       r2: "one shared mapping phi_c(z) per channel; capacity affine at the median q1 shared by all units; theta, q1, noise and pattern rate resampled jointly",
       r3: "non-capacity channels phi_c(z) + delta_{c,i} by backfitting with median_i delta = 0; capacity affine with the unit's own q1; delta resampled jointly with theta (declared_by_design.v2.per_unit_offsets)",
       reason: "v1: MATR TSTR 3.42; per-cell charging-policy offsets hypothesised (S3 anomaly 4; tested by X1); unconditional permutation importance of charge time / mean discharge V <= 0.032 (usage tested by X4)"}
    - {date: 2026-10-07, comment: "r3 (X3)", keys: [declared_by_design.noise.cross_channel],
       r2: "noise independent per channel in generation; residual covariance recorded and compared at S5",
       r3: "innovations drawn jointly with correlation chosen so the stationary residual correlation equals the fitted one (after X2); null channels independent (declared_by_design.v2.correlated_noise)",
       reason: "v1 covariance agreement 0.685 (MATR) and 0.421 (HUST) relative Frobenius against baselines 0.278 and 0.038"}
    - {date: 2026-10-07, comment: "r3 (X4, X5)", keys: [declared_by_design.scoring, declared_by_design.usability],
       r2: "rank agreement, retrieval (paired), zero-weight mass; no channel-usage requirement",
       r3: "adds channel allocation error (TV distance) and temporal profile error (1-Wasserstein over positions); channel-level trained-model scores void where a weighted channel is not used (conditional importance lower bound <= 0)",
       reason: "v1 S7: rank agreement >= 0.96 under smoothing at sigma = 8 and changes < 0.001 for mass moved toward the end below a full shift; S6: unconditional permutation importance of the weighted non-capacity channels <= 0.032 (whether they are used is what X4 tests)"}
    - {date: 2026-10-07, comment: "r3 (X6, X7)", keys: [declared_by_design.attribution.methods.timeshap, declared_by_design.attribution.windows_scored_per_profile],
       v1_as_run: "TimeSHAP reduced at run time by D23 to 40 of 120 windows, seeds 0-1 trained / 0 reference, no ensemble floor (the r2 declaration itself was the full scale); NASA PCoE third profile",
       r3: "TimeSHAP at the full declared scale incl. the ten-member ensemble floor (declared_by_design.v2.timeshap_full_scale); third profile chosen by declared eligibility (declared_by_design.v2.third_profile)",
       reason: "D23's reductions left TimeSHAP's identifiability floor unmeasured; NASA PCoE gave no usable result"}
    - {date: 2026-10-07, comment: "D27 (post-data, V1)", keys: [declared_by_design.channel_series.cleaning_rule],
       r2: "single departing readings masked (D17, runs of 1)",
       r3: "runs of up to three departing readings masked (max_run_v2: 3), all v2 profiles, before any v2 refit",
       reason: "held-out MATR charge-time residual variance 53.0 min2 came from one paused cycle (1 301.6 min) in MATR_b1c2 whose recovery reading also departed, so D17's neighbour clause kept it; set after the data were seen"}
    - {date: 2026-10-07, comment: "D28 (pre-data, V2; documentation only, before any download)", keys: [declared_by_design.v2.third_profile.candidate_rules, declared_by_design.v2.readings.X6_ii_regeneration_at_scale, declared_by_design.v2.third_profile.candidates_in_order],
       r3: "candidate rules not yet declared; X6(ii) read on the pooled D05 outcome; Tongji note 'one cell type meeting eligibility'",
       new: "ISU-ILCC (c-iii) with the declared extraction, scope (authors' validated cells, mean DoD >= 50%, 145 cells), strata, controls and the stratified X6(ii) reading; Tongji note superseded by its documentation_finding (entered at v0 commit 9c25b6c from the documentation sweep, no data seen)",
       reason: "options (a), (b) and Tongji fail E3/E4 on documentation; (c-iii) meets E1-E4 with noise and pattern estimation on measured residuals; reviewed by three lenses and a judge before commit"}

