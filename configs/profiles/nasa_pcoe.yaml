# NASA PCoE profile: dataset-level facts declared from the dataset's own primary documentation (C3, r2).
dataset: NASA_PCoE
batteryml_name: null   # not supported by BatteryML; converted by degradx.data.nasa (brief §2.2)
nominal_capacity_Ah:
  value: 2.0
  source: >-
    NASA Prognostics Data Repository, "5. Battery Data Set", 1_README.txt: "30% fade in rated capacity (from 2Ahr to
    1.4Ahr)"; the repository gives rated capacity, which is used as nominal (docs/S0_RESEARCH/datasets.md §3.2).
