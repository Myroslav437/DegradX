       r2: "z_t = (q1 - q_t) / (q1 - rho * q_nom), q_nom per profile from primary documentation, q1 = max smoothed capacity over first k=20 positions, guard q1 - rho*q_nom >= 0.05 q_nom; r1 definition kept as a sensitivity point",
       reason: "MATR/HUST cells were cycled to 80% of nominal capacity; rho applied to a higher observed initial capacity puts EOL below where cycling stopped, and early capacity rise makes a first-position anchor give z < 0"}
    - {date: 2026-09-15, comment: C4, keys: [declared_by_design.attribution.baseline],
       r1: "attribution baseline OPEN (TimeSHAP convention: average-event background)",
       r2: "primary baseline = pristine window x0 for IG, occlusion and TimeSHAP background; ground truth supplied per baseline; secondary TimeSHAP run from the average event scored against phi*(xbar)",
